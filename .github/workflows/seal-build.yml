# Sealed build of micrometer-core. Upstream builds and tests on CircleCI
# (.circleci/config.yml: cimg/openjdk:15.0, `./gradlew check test` + `dockerTest`);
# this translates that job for micrometer-core onto GitHub Actions.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle --tests selector; empty runs the full micrometer-core suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"'
      RELEASE_FLAGS: '-Prelease.version=1.5.7 -Prelease.stage=final -Prelease.disableGitChecks=true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Public jar manifest: Created-By 15.0.1+9, Gradle-Version 6.7
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '15.0.1'

      - name: Test logging init script
        run: |
          cat > "$RUNNER_TEMP/test-logging.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "passed", "skipped", "failed"
                      exceptionFormat "full"
                      showStandardStreams = false
                  }
                  afterSuite { desc, result ->
                      if (!desc.parent) {
                          println "TEST SUMMARY [${project.path}:${name}]: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped -> ${result.resultType}"
                      }
                  }
              }
          }
          EOF

      - name: Test micrometer-core
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            ./gradlew --no-daemon --console=plain --stacktrace -I "$RUNNER_TEMP/test-logging.gradle" $RELEASE_FLAGS :micrometer-core:test --tests "$TEST_FILTER"
          else
            ./gradlew --no-daemon --console=plain --stacktrace -I "$RUNNER_TEMP/test-logging.gradle" $RELEASE_FLAGS :micrometer-core:test
          fi

      - name: Docker-tagged tests (upstream docker-tests job)
        if: ${{ inputs.test-filter == '' }}
        env:
          # testcontainers 1.14.1 pulls its reaper from quay.io/testcontainers/ryuk:0.2.3,
          # which no longer exists; the runner VM is ephemeral, so the reaper is not needed.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./gradlew --no-daemon --console=plain --stacktrace -I "$RUNNER_TEMP/test-logging.gradle" $RELEASE_FLAGS :micrometer-core:dockerTest

      - name: Test report (counts and skip reasons)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, os
          import xml.etree.ElementTree as ET
          def reason_for(cls, method):
              path = glob.glob('micrometer-core/src/test/java/' + cls.replace('.', '/').split('$')[0] + '.java')
              if not path:
                  return 'no source found'
              src = open(path[0]).read()
              m = re.search(r'(@Disabled[^\n]*)\n(?:.*\n){0,6}?\s*(?:public\s+)?(?:class|void\s+' + re.escape(method) + r')', src)
              if m:
                  return m.group(1).strip()
              body = re.search(r'void\s+' + re.escape(method.split('(')[0]) + r'\s*\([^)]*\)[^{]*\{(.*?)\n    \}', src, re.S)
              if body:
                  a = re.search(r'(assume\w+\([^;]*\));', body.group(1))
                  if a:
                      return 'assumption not met: ' + a.group(1)
              if '@Disabled' in src:
                  return 'class-level ' + re.search(r'@Disabled[^\n]*', src).group(0)
              return 'skipped by JUnit (see source)'
          for task in ('test', 'dockerTest'):
              files = glob.glob('micrometer-core/build/test-results/%s/TEST-*.xml' % task)
              if not files:
                  continue
              t = f = e = s = 0
              skips = []
              for fn in files:
                  r = ET.parse(fn).getroot()
                  t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
                  for tc in r.iter('testcase'):
                      if tc.find('skipped') is not None:
                          skips.append((tc.get('classname'), tc.get('name')))
              print('TEST REPORT micrometer-core %s: %d tests, %d passed, %d failed, %d errors, %d skipped' % (task, t, t - f - e - s, f, e, s))
              for c, n in skips:
                  print('SKIPPED TEST %s.%s -- reason: %s' % (c, n, reason_for(c, n)))
          EOF

      - name: Build jar
        run: ./gradlew --no-daemon --console=plain --stacktrace $RELEASE_FLAGS :micrometer-core:jar

      - uses: actions/upload-artifact@v4
        with:
          name: micrometer-core-jar
          path: micrometer-core/build/libs/micrometer-core-1.5.7.jar
          if-no-files-found: error
